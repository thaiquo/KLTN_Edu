name: Publish images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  backend-images:
    name: Publish ${{ matrix.image }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image: gateway
            dockerfile: backend/api-gateway/Dockerfile
          - image: account
            dockerfile: backend/account-service/Dockerfile
          - image: learning
            dockerfile: backend/learning-service/Dockerfile
          - image: contract
            dockerfile: backend/contract-service/Dockerfile
          - image: notification
            dockerfile: backend/notification-service/Dockerfile
          - image: ai
            dockerfile: backend/ai-service/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/educonnect-${{ matrix.image }}:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  web-image:
    name: Publish Web
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate public production settings
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          VITE_ESCROW_CONTRACT_ADDRESS: ${{ vars.VITE_ESCROW_CONTRACT_ADDRESS }}
          VITE_USDC_CONTRACT_ADDRESS: ${{ vars.VITE_USDC_CONTRACT_ADDRESS }}
          VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}
        run: |
          test -n "$PRODUCTION_ORIGIN"
          test -n "$VITE_ESCROW_CONTRACT_ADDRESS"
          test -n "$VITE_USDC_CONTRACT_ADDRESS"
          test -n "$VITE_SEPOLIA_RPC_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend-web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/educonnect-web:${{ env.RELEASE_SHA }}
          build-args: |
            VITE_API_URL=${{ vars.PRODUCTION_ORIGIN }}
            VITE_API_GATEWAY_URL=${{ vars.PRODUCTION_ORIGIN }}
            VITE_REALTIME_URL=${{ vars.PRODUCTION_REALTIME_ORIGIN }}
            VITE_DEFAULT_CHAIN_ID=11155111
            VITE_ESCROW_CONTRACT_ADDRESS=${{ vars.VITE_ESCROW_CONTRACT_ADDRESS }}
            VITE_USDC_CONTRACT_ADDRESS=${{ vars.VITE_USDC_CONTRACT_ADDRESS }}
            VITE_SEPOLIA_RPC_URL=${{ vars.VITE_SEPOLIA_RPC_URL }}
            VITE_PROJECT_ID_WALLETCONNECT=${{ vars.VITE_PROJECT_ID_WALLETCONNECT }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-production:
    name: Deploy VPS
    needs:
      - backend-images
      - web-image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: educonnect-production-vps
      cancel-in-progress: false
    steps:
      - name: Check out published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Skip superseded release
        id: release-check
        run: |
          set -euo pipefail
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$current_main"
          if [[ "$current_main" == "$RELEASE_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $RELEASE_SHA because main is now $current_main"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure dedicated SSH identity
        if: steps.release-check.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/educonnect_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/educonnect_deploy" "$HOME/.ssh/known_hosts"

      - name: Stage non-secret deployment files
        if: steps.release-check.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$HOME/.ssh/educonnect_deploy" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          stage="/home/deploy/educonnect-incoming/$RELEASE_SHA"
          ssh "${ssh_args[@]}" "deploy@$VPS_HOST" "install -d -m 700 '$stage'"
          tar -cf - compose.vps.yaml deploy/Caddyfile |
            ssh "${ssh_args[@]}" "deploy@$VPS_HOST" "tar -xf - -C '$stage'"

      - name: Deploy and verify release
        if: steps.release-check.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/educonnect_deploy" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$VPS_HOST" "sudo -n /usr/local/sbin/educonnect-release deploy '$RELEASE_SHA'"
