name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - account-service
          - learning-service
          - contract-service
          - notification-service
          - ai-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Run tests
        env:
          CHATBOT_KNOWLEDGE_DIRECTORY: ${{ github.workspace }}/docs/chatbot-knowledge
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend-build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build production assets
        working-directory: frontend-web
        env:
          VITE_API_URL: https://educonnect.example.com
          VITE_API_GATEWAY_URL: https://educonnect.example.com
          VITE_REALTIME_URL: wss://educonnect.example.com
          VITE_DEFAULT_CHAIN_ID: "11155111"
        run: npm run build

  compose-validation:
    name: Validate VPS Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate base and operator overlays
        env:
          DOMAIN: educonnect.example.com
          GHCR_OWNER: example
          RELEASE_TAG: 0000000000000000000000000000000000000000
          POSTGRES_PASSWORD: validation-only
          RABBITMQ_PASSWORD: validation-only
          JWT_SECRET: validation-only-validation-only-validation-only
          MAIL_USERNAME: validation@example.com
          MAIL_PASSWORD: validation-only
          AWS_REGION: ap-southeast-1
          AWS_S3_BUCKET: validation-only
          AWS_ACCESS_KEY_ID: validation-only
          AWS_SECRET_ACCESS_KEY: validation-only
          BLOCKCHAIN_OPERATOR_ADDRESS: "0x0000000000000000000000000000000000000001"
          BLOCKCHAIN_OPERATOR_KEYSTORE_HOST_PATH: ./secrets/operator-keystore.json
          BLOCKCHAIN_OPERATOR_PASSWORD_FILE_HOST_PATH: ./secrets/operator-keystore-password
        run: |
          docker compose --env-file deploy/production.env.example -f compose.vps.yaml config --quiet
          docker compose --env-file deploy/production.env.example -f compose.vps.yaml -f compose.vps.operator.yaml config --quiet

  image-builds:
    name: Build image ${{ matrix.image }}
    needs:
      - backend-tests
      - frontend-build
      - compose-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image: gateway
            dockerfile: backend/api-gateway/Dockerfile
          - image: account
            dockerfile: backend/account-service/Dockerfile
          - image: learning
            dockerfile: backend/learning-service/Dockerfile
          - image: contract
            dockerfile: backend/contract-service/Dockerfile
          - image: notification
            dockerfile: backend/notification-service/Dockerfile
          - image: ai
            dockerfile: backend/ai-service/Dockerfile
          - image: web
            dockerfile: frontend-web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
