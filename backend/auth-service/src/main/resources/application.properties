spring.application.name=account-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authservice;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

auth.outbox.exchange=${AUTH_OUTBOX_EXCHANGE:auth.outbox.exchange}
auth.outbox.queue=${AUTH_OUTBOX_QUEUE:auth.outbox.queue}
auth.outbox.relay.fixed-delay-ms=${AUTH_OUTBOX_RELAY_FIXED_DELAY_MS:5000}

auth.jwt.secret=${AUTH_JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
auth.jwt.issuer=${AUTH_JWT_ISSUER:account-service}
auth.jwt.access-token-ttl-minutes=${AUTH_JWT_ACCESS_TTL_MINUTES:15}
auth.jwt.refresh-token-ttl-days=${AUTH_JWT_REFRESH_TTL_DAYS:7}

auth.cookie.access-token-name=${AUTH_COOKIE_ACCESS_NAME:access_token}
auth.cookie.refresh-token-name=${AUTH_COOKIE_REFRESH_NAME:refresh_token}
auth.cookie.csrf-token-name=${AUTH_COOKIE_CSRF_NAME:XSRF-TOKEN}
auth.cookie.path=${AUTH_COOKIE_PATH:/}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.access-token-max-age-seconds=${AUTH_COOKIE_ACCESS_MAX_AGE_SECONDS:900}
auth.cookie.refresh-token-max-age-seconds=${AUTH_COOKIE_REFRESH_MAX_AGE_SECONDS:604800}

auth.security.login.max-attempts=${AUTH_SECURITY_LOGIN_MAX_ATTEMPTS:5}
auth.security.login.window-minutes=${AUTH_SECURITY_LOGIN_WINDOW_MINUTES:10}
auth.security.login.block-minutes=${AUTH_SECURITY_LOGIN_BLOCK_MINUTES:15}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
