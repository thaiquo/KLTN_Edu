spring.application.name=api-gateway
server.port=${API_GATEWAY_PORT:8080}

spring.codec.max-in-memory-size=${GATEWAY_MAX_IN_MEMORY_SIZE:20MB}

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/account/**,/api/auth/**,/api/users/**,/api/admin/**,/api/tutors/**,/api/tutor-applications/**,/api/staff/tutor-applications/**,/api/staff/tutors/**,/api/reference/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/account/(?<segment>.*),/api/$\{segment}

spring.cloud.gateway.server.webflux.routes[1].id=learning-service
spring.cloud.gateway.server.webflux.routes[1].uri=${LEARNING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/learning/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/learning/(?<segment>.*),/api/$\{segment}

spring.cloud.gateway.server.webflux.routes[2].id=account-realtime
spring.cloud.gateway.server.webflux.routes[2].uri=${ACCOUNT_SERVICE_WS_URL:ws://localhost:8081}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ws/account

spring.cloud.gateway.server.webflux.routes[3].id=learning-realtime
spring.cloud.gateway.server.webflux.routes[3].uri=${LEARNING_SERVICE_WS_URL:ws://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ws/learning

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Set-Cookie

# Deduplicate CORS headers that get added by both Gateway (globalcors) and
# downstream services (e.g. account-service Spring Security CorsFilter).
# Without this, browser receives duplicate Access-Control-Allow-Origin /
# Access-Control-Allow-Credentials and rejects the response with a CORS error
# even though the backend returned HTTP 201.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST
