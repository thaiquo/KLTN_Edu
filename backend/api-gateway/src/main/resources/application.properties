spring.application.name=api-gateway
server.port=${API_GATEWAY_PORT:8080}

spring.codec.max-in-memory-size=${GATEWAY_MAX_IN_MEMORY_SIZE:20MB}
jwt.secret=${JWT_SECRET}

# Login abuse protection: one fixed Redis-backed window per resolved client IP.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
security.login-rate-limit.enabled=${LOGIN_IP_RATE_LIMIT_ENABLED:true}
security.login-rate-limit.requests=${LOGIN_IP_RATE_LIMIT_REQUESTS:20}
security.login-rate-limit.window=${LOGIN_IP_RATE_LIMIT_WINDOW:1m}
security.login-rate-limit.trusted-proxy-cidrs=${LOGIN_TRUSTED_PROXY_CIDRS:}

# Admin/Staff M3.3 operational SLA policy. Business deadlines from owner services always win.
operations.sla.source-zone=${OPERATIONS_SLA_SOURCE_ZONE:Asia/Ho_Chi_Minh}
operations.sla.business-deadline-warning=${OPERATIONS_SLA_BUSINESS_WARNING:PT6H}
operations.sla.tutor-application.target=${OPERATIONS_SLA_TUTOR_TARGET:P3D}
operations.sla.tutor-application.warning=${OPERATIONS_SLA_TUTOR_WARNING:P1D}
operations.sla.teaching-registration.target=${OPERATIONS_SLA_TEACHING_TARGET:P3D}
operations.sla.teaching-registration.warning=${OPERATIONS_SLA_TEACHING_WARNING:P1D}
operations.sla.class-approval.target=${OPERATIONS_SLA_CLASS_TARGET:P2D}
operations.sla.class-approval.warning=${OPERATIONS_SLA_CLASS_WARNING:PT12H}
operations.sla.community-moderation.target=${OPERATIONS_SLA_COMMUNITY_TARGET:P1D}
operations.sla.community-moderation.warning=${OPERATIONS_SLA_COMMUNITY_WARNING:PT4H}
operations.sla.support-ticket.target=${OPERATIONS_SLA_SUPPORT_TARGET:P2D}
operations.sla.support-ticket.warning=${OPERATIONS_SLA_SUPPORT_WARNING:PT8H}
operations.sla.notifications.enabled=${OPERATIONS_SLA_NOTIFICATIONS_ENABLED:true}
operations.sla.notifications.account-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
operations.sla.notifications.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
operations.sla.scheduler.enabled=${OPERATIONS_SLA_SCHEDULER_ENABLED:true}
operations.sla.scheduler.initial-delay=${OPERATIONS_SLA_SCHEDULER_INITIAL_DELAY:PT30S}
operations.sla.scheduler.interval=${OPERATIONS_SLA_SCHEDULER_INTERVAL:PT5M}
operations.sources.timeout=${OPERATIONS_SOURCE_TIMEOUT:PT5S}
operations.sources.degraded-threshold=${OPERATIONS_SOURCE_DEGRADED_THRESHOLD:PT2S}
tutor.statistics.learning-url=${LEARNING_SERVICE_URL:http://localhost:8082}
tutor.statistics.contract-url=${CONTRACT_SERVICE_URL:http://localhost:8083}
tutor.statistics.sources.timeout=${TUTOR_STATISTICS_SOURCE_TIMEOUT:PT5S}

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# 0. Account Service
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/account/**,/api/auth/**,/api/users/**,/api/admin/**,/api/tutors/**,/api/tutor-applications/**,/api/staff/tutor-applications/**,/api/staff/tutors/**,/api/reference/**,/api/support/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/account/(?<segment>.*),/api/$\{segment}
spring.cloud.gateway.server.webflux.routes[0].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST

# 1. Learning Service
spring.cloud.gateway.server.webflux.routes[1].id=learning-service
spring.cloud.gateway.server.webflux.routes[1].uri=${LEARNING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/learning/**,/api/community/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/learning/(?<segment>.*),/api/$\{segment}
spring.cloud.gateway.server.webflux.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST

# 2. Contract Service
spring.cloud.gateway.server.webflux.routes[2].id=contract-service
spring.cloud.gateway.server.webflux.routes[2].uri=${CONTRACT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/contracts/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST

# 3. Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST

# 4. Chat Service (Notification Service handles chat)
spring.cloud.gateway.server.webflux.routes[4].id=chat-service
spring.cloud.gateway.server.webflux.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/chat/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST

# 5. AI Service
spring.cloud.gateway.server.webflux.routes[5].id=ai-service
spring.cloud.gateway.server.webflux.routes[5].uri=${AI_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary RETAIN_FIRST

# Realtime WebSockets
spring.cloud.gateway.server.webflux.routes[6].id=account-realtime
spring.cloud.gateway.server.webflux.routes[6].uri=${ACCOUNT_SERVICE_WS_URL:ws://localhost:8081}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/ws/account

spring.cloud.gateway.server.webflux.routes[7].id=learning-realtime
spring.cloud.gateway.server.webflux.routes[7].uri=${LEARNING_SERVICE_WS_URL:ws://localhost:8082}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/ws/learning

spring.cloud.gateway.server.webflux.routes[8].id=notification-realtime
spring.cloud.gateway.server.webflux.routes[8].uri=${NOTIFICATION_SERVICE_WS_URL:ws://localhost:8084}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/ws/notifications

spring.cloud.gateway.server.webflux.routes[9].id=chat-realtime
spring.cloud.gateway.server.webflux.routes[9].uri=${NOTIFICATION_SERVICE_WS_URL:ws://localhost:8084}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/ws/chat

spring.cloud.gateway.server.webflux.routes[10].id=learning-mobile-realtime
spring.cloud.gateway.server.webflux.routes[10].uri=${LEARNING_SERVICE_WS_URL:ws://localhost:8082}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/ws/learning/mobile

# Global CORS Configuration
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Set-Cookie,Retry-After
