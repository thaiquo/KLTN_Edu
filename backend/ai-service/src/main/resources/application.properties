spring.application.name=ai-service
server.port=${AI_SERVICE_PORT:8085}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
learning.service.url=${LEARNING_SERVICE_URL:http://localhost:8082}
contract.service.url=${CONTRACT_SERVICE_URL:http://localhost:8083}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Shared Database Configuration (Optional / Read-Only access if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# AI Provider Configurations (Gemini / OpenAI / Qdrant)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
embedding.provider=${EMBEDDING_PROVIDER:gemini}
embedding.model=${EMBEDDING_MODEL:gemini-embedding-2}
embedding.dimensions=${EMBEDDING_DIMENSIONS:768}
embedding.api-key=${GEMINI_API_KEY:}
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.collection=${QDRANT_COLLECTION:tutor_capabilities_v1}
class.qdrant.collection=${CLASS_QDRANT_COLLECTION:public_classes_v1}
qdrant.vector-size=${EMBEDDING_DIMENSIONS:768}
chatbot.knowledge.directory=${CHATBOT_KNOWLEDGE_DIRECTORY:docs/chatbot-knowledge}
chatbot.knowledge.version=${CHATBOT_KNOWLEDGE_VERSION:1}
chatbot.qdrant.collection=${CHATBOT_QDRANT_COLLECTION:educonnect_chatbot_knowledge_v1}
chatbot.rag.top-k=${CHATBOT_RAG_TOP_K:4}
chatbot.rag.min-score=${CHATBOT_RAG_MIN_SCORE:0.35}
chatbot.knowledge.startup-delay-ms=${CHATBOT_KNOWLEDGE_STARTUP_DELAY_MS:1000}
chatbot.knowledge.recovery-interval-ms=${CHATBOT_KNOWLEDGE_RECOVERY_INTERVAL_MS:30000}
chatbot.knowledge.retry-attempts=${CHATBOT_KNOWLEDGE_RETRY_ATTEMPTS:3}
chatbot.knowledge.retry-initial-backoff-ms=${CHATBOT_KNOWLEDGE_RETRY_INITIAL_BACKOFF_MS:1000}
chatbot.knowledge.auto-sync-enabled=${CHATBOT_KNOWLEDGE_AUTO_SYNC_ENABLED:true}
logging.level.org.springframework.web.client=INFO
semantic.document-version=${SEMANTIC_DOCUMENT_VERSION:1}
semantic.search.top-k=${SEMANTIC_SEARCH_TOP_K:20}
semantic.index.auto-recovery-enabled=${SEMANTIC_INDEX_AUTO_RECOVERY_ENABLED:true}
semantic.index.startup-delay-ms=${SEMANTIC_INDEX_STARTUP_DELAY_MS:5000}
semantic.index.recovery-interval-ms=${SEMANTIC_INDEX_RECOVERY_INTERVAL_MS:60000}
class.semantic.search.top-k=${CLASS_SEMANTIC_SEARCH_TOP_K:20}
semantic.matching.enabled=${SEMANTIC_MATCHING_ENABLED:true}
semantic.matching.max-rank-boost=${SEMANTIC_MATCHING_MAX_RANK_BOOST:3.0}
class.semantic.matching.enabled=${CLASS_SEMANTIC_MATCHING_ENABLED:true}
class.semantic.matching.max-rank-boost=${CLASS_SEMANTIC_MATCHING_MAX_RANK_BOOST:3.0}
