spring.application.name=ai-service
server.port=${AI_SERVICE_PORT:8085}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
learning.service.url=${LEARNING_SERVICE_URL:http://localhost:8082}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Shared Database Configuration (Optional / Read-Only access if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# AI Provider Configurations (Gemini / OpenAI / Qdrant)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
embedding.provider=${EMBEDDING_PROVIDER:gemini}
embedding.model=${EMBEDDING_MODEL:gemini-embedding-2}
embedding.dimensions=${EMBEDDING_DIMENSIONS:768}
embedding.api-key=${GEMINI_API_KEY:}
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.collection=${QDRANT_COLLECTION:tutor_capabilities_v1}
class.qdrant.collection=${CLASS_QDRANT_COLLECTION:public_classes_v1}
qdrant.vector-size=${EMBEDDING_DIMENSIONS:768}
semantic.document-version=${SEMANTIC_DOCUMENT_VERSION:1}
semantic.search.top-k=${SEMANTIC_SEARCH_TOP_K:20}
class.semantic.search.top-k=${CLASS_SEMANTIC_SEARCH_TOP_K:20}
semantic.matching.enabled=${SEMANTIC_MATCHING_ENABLED:true}
semantic.matching.max-rank-boost=${SEMANTIC_MATCHING_MAX_RANK_BOOST:3.0}
class.semantic.matching.enabled=${CLASS_SEMANTIC_MATCHING_ENABLED:true}
class.semantic.matching.max-rank-boost=${CLASS_SEMANTIC_MATCHING_MAX_RANK_BOOST:3.0}
