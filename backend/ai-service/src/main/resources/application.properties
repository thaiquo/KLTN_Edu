spring.application.name=ai-service
server.port=${AI_SERVICE_PORT:8085}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
learning.service.url=${LEARNING_SERVICE_URL:http://localhost:8082}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Shared Database Configuration (Optional / Read-Only access if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# AI Provider Configurations (Gemini / OpenAI / Qdrant)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}
