spring.application.name=notification-service

server.port=${NOTIFICATION_SERVICE_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:quocthai}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_notification_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

learning.service.url=${LEARNING_SERVICE_URL:http://localhost:8082}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

chat.storage.provider=${CHAT_STORAGE_PROVIDER:s3}
chat.storage.bucket=${CHAT_STORAGE_BUCKET:${AWS_S3_BUCKET:}}
chat.storage.region=${CHAT_STORAGE_REGION:${AWS_REGION:ap-southeast-1}}
chat.storage.access-key-id=${AWS_ACCESS_KEY_ID:}
chat.storage.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
chat.storage.key-prefix=${CHAT_STORAGE_KEY_PREFIX:${S3_KEY_PREFIX:dev}}
chat.storage.presigned-url-duration=${CHAT_STORAGE_PRESIGNED_URL_DURATION:${S3_PRESIGNED_URL_DURATION:10m}}
spring.servlet.multipart.max-file-size=${CHAT_MULTIPART_MAX_FILE_SIZE:40MB}
spring.servlet.multipart.max-request-size=${CHAT_MULTIPART_MAX_REQUEST_SIZE:60MB}
chat.attachment.max-image-files=${CHAT_IMAGE_MAX_FILES:5}
chat.attachment.max-image-bytes=${CHAT_ATTACHMENT_MAX_IMAGE_BYTES:10485760}
chat.attachment.max-video-bytes=${CHAT_ATTACHMENT_MAX_VIDEO_BYTES:41943040}
