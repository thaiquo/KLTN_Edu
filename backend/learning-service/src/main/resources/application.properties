spring.application.name=learning-service
debug=${SPRING_BOOT_DEBUG:false}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kltn_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:quocthai}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=learning
# Weekly availability is a local teaching time (not an instant). Keep 00:00-23:00 unchanged for Vietnam.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=learning
spring.flyway.default-schema=learning
spring.flyway.create-schemas=true
