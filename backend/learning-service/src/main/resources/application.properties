spring.application.name=learning-service
server.port=${LEARNING_SERVICE_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:quocthai}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_learning_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:250MB}

app.storage.provider=${STORAGE_PROVIDER:s3}
app.storage.bucket=${AWS_S3_BUCKET:}
app.storage.region=${AWS_REGION:ap-southeast-1}
app.storage.access-key-id=${AWS_ACCESS_KEY_ID:}
app.storage.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.key-prefix=${S3_KEY_PREFIX:dev}
app.storage.presigned-url-duration=${S3_PRESIGNED_URL_DURATION:10m}
app.storage.local-root=${LEARNING_STORAGE_LOCAL_ROOT:./data/learning-storage}
