spring.application.name=account-service
server.port=${ACCOUNT_SERVICE_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:12MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_account_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.access-token-path=${AUTH_ACCESS_COOKIE_PATH:/}
app.auth.cookie.refresh-token-path=${AUTH_REFRESH_COOKIE_PATH:/api/auth}
app.auth.cookie.refresh-token-max-age=${AUTH_REFRESH_TOKEN_MAX_AGE:7d}

# Login abuse protection. Redis is shared between Account Service instances.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
app.auth.login-protection.enabled=${LOGIN_PROTECTION_ENABLED:true}
app.auth.login-protection.failure-threshold=${LOGIN_FAILURE_THRESHOLD:3}
app.auth.login-protection.failure-window=${LOGIN_FAILURE_WINDOW:10m}
app.auth.login-protection.lock-duration=${LOGIN_ATTEMPT_LOCK_DURATION:10s}
app.auth.turnstile.enabled=${TURNSTILE_ENABLED:true}
app.auth.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.auth.turnstile.siteverify-url=${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
app.auth.turnstile.expected-action=${TURNSTILE_EXPECTED_ACTION:login}
app.auth.turnstile.allowed-hostnames=${TURNSTILE_ALLOWED_HOSTNAMES:}
app.auth.turnstile.connect-timeout=${TURNSTILE_CONNECT_TIMEOUT:3s}
app.auth.turnstile.read-timeout=${TURNSTILE_READ_TIMEOUT:5s}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
learning.service.url=${LEARNING_SERVICE_URL:http://localhost:8082}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.expiration=${OTP_EXPIRATION:5m}
app.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:60s}
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:true}

# SMTP config for real OTP email sending.
# Use a Gmail App Password here, not your normal Gmail password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.env=${APP_ENV:dev}
staff.duty.enforcement-enabled=${STAFF_DUTY_ENFORCEMENT_ENABLED:true}

app.storage.provider=${STORAGE_PROVIDER:s3}
app.storage.bucket=${AWS_S3_BUCKET:}
app.storage.region=${AWS_REGION:ap-southeast-1}
app.storage.access-key-id=${AWS_ACCESS_KEY_ID:}
app.storage.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.key-prefix=${S3_KEY_PREFIX:dev}
app.storage.presigned-url-duration=${S3_PRESIGNED_URL_DURATION:10m}

app.file-policy.avatar.allowed-content-types=image/jpeg,image/png,image/webp
app.file-policy.avatar.allowed-extensions=jpg,jpeg,png,webp
app.file-policy.avatar.max-size=2MB
app.file-policy.identity.allowed-content-types=image/jpeg,image/png
app.file-policy.identity.allowed-extensions=jpg,jpeg,png
app.file-policy.identity.max-size=5MB
app.file-policy.certificate.allowed-content-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream
app.file-policy.certificate.allowed-extensions=jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx
app.file-policy.certificate.max-size=10MB
app.file-policy.max-certificate-count=5
