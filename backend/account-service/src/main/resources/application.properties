spring.application.name=account-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kltn_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.expiration=${OTP_EXPIRATION:5m}
app.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:60s}
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:false}

# SMTP config for real OTP email sending.
# Use a Gmail App Password here, not your normal Gmail password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.storage.provider=${STORAGE_PROVIDER:s3}
app.storage.bucket=${AWS_S3_BUCKET:}
app.storage.region=${AWS_REGION:ap-southeast-1}
app.storage.access-key-id=${AWS_ACCESS_KEY_ID:}
app.storage.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.presigned-url-duration=${S3_PRESIGNED_URL_DURATION:10m}

app.file-policy.avatar.allowed-content-types=image/jpeg,image/png,image/webp
app.file-policy.avatar.allowed-extensions=jpg,jpeg,png,webp
app.file-policy.avatar.max-size=2MB
app.file-policy.identity.allowed-content-types=image/jpeg,image/png
app.file-policy.identity.allowed-extensions=jpg,jpeg,png
app.file-policy.identity.max-size=5MB
app.file-policy.certificate.allowed-content-types=image/jpeg,image/png,application/pdf
app.file-policy.certificate.allowed-extensions=jpg,jpeg,png,pdf
app.file-policy.certificate.max-size=10MB
app.file-policy.max-certificate-count=10
