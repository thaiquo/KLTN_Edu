spring.application.name=contract-service
server.port=${CONTRACT_SERVICE_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_contract_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false

# Blockchain reads remain independently switchable. Operator writes require both
# blockchain.enabled=true and blockchain.operator.enabled=true.
blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:0}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.escrow-address=${BLOCKCHAIN_ESCROW_ADDRESS:}
blockchain.usdc-address=${BLOCKCHAIN_USDC_ADDRESS:}
blockchain.token-decimals=${BLOCKCHAIN_TOKEN_DECIMALS:6}
blockchain.confirmations=${BLOCKCHAIN_CONFIRMATIONS:1}
blockchain.start-block=${BLOCKCHAIN_START_BLOCK:0}
blockchain.event-block-batch-size=${BLOCKCHAIN_EVENT_BLOCK_BATCH_SIZE:500}
blockchain.event-poll-initial-delay-ms=${BLOCKCHAIN_EVENT_POLL_INITIAL_DELAY_MS:5000}
blockchain.event-poll-interval-ms=${BLOCKCHAIN_EVENT_POLL_INTERVAL_MS:5000}
blockchain.operator.enabled=${BLOCKCHAIN_OPERATOR_ENABLED:false}
blockchain.operator.address=${BLOCKCHAIN_OPERATOR_ADDRESS:}
blockchain.operator.keystore-path=${BLOCKCHAIN_OPERATOR_KEYSTORE_PATH:}
blockchain.operator.keystore-password=${BLOCKCHAIN_OPERATOR_KEYSTORE_PASSWORD:}
blockchain.operator.gas-limit=${BLOCKCHAIN_OPERATOR_GAS_LIMIT:1500000}
