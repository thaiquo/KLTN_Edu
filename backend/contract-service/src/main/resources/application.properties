spring.application.name=contract-service
server.port=${CONTRACT_SERVICE_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kltn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_contract_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false

# Blockchain reads remain independently switchable. Operator writes require both
# blockchain.enabled=true and blockchain.operator.enabled=true.
blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:0}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.escrow-address=${BLOCKCHAIN_ESCROW_ADDRESS:}
blockchain.usdc-address=${BLOCKCHAIN_USDC_ADDRESS:}
blockchain.token-decimals=${BLOCKCHAIN_TOKEN_DECIMALS:6}
blockchain.confirmations=${BLOCKCHAIN_CONFIRMATIONS:1}
blockchain.start-block=${BLOCKCHAIN_START_BLOCK:0}
blockchain.event-block-batch-size=${BLOCKCHAIN_EVENT_BLOCK_BATCH_SIZE:500}
blockchain.event-poll-initial-delay-ms=${BLOCKCHAIN_EVENT_POLL_INITIAL_DELAY_MS:5000}
blockchain.event-poll-interval-ms=${BLOCKCHAIN_EVENT_POLL_INTERVAL_MS:5000}
blockchain.operator.enabled=${BLOCKCHAIN_OPERATOR_ENABLED:false}
blockchain.operator.address=${BLOCKCHAIN_OPERATOR_ADDRESS:}
blockchain.operator.keystore-path=${BLOCKCHAIN_OPERATOR_KEYSTORE_PATH:}
blockchain.operator.keystore-password=${BLOCKCHAIN_OPERATOR_KEYSTORE_PASSWORD:}
blockchain.operator.gas-limit=${BLOCKCHAIN_OPERATOR_GAS_LIMIT:1500000}

# Contract document artifacts. Local storage keeps development runnable without
# cloud credentials; set CONTRACT_STORAGE_PROVIDER=s3 for S3 in deployment.
contract.document.template-resource=classpath:contract-templates/EDUCONNECT_HOP_DONG_TEMPLATE_V1.docx
contract.document.template-version=EDUCONNECT_HOP_DONG_TEMPLATE_V1
contract.document.converter-url=${CONTRACT_CONVERTER_URL:http://localhost:3000/forms/libreoffice/convert}
contract.document.converter-connect-timeout=${CONTRACT_CONVERTER_CONNECT_TIMEOUT:5s}
contract.document.converter-read-timeout=${CONTRACT_CONVERTER_READ_TIMEOUT:60s}
contract.document.max-docx-bytes=${CONTRACT_MAX_DOCX_BYTES:10485760}
contract.document.max-pdf-bytes=${CONTRACT_MAX_PDF_BYTES:20971520}
contract.document.verification-base-url=${CONTRACT_VERIFICATION_BASE_URL:http://localhost:5173/contracts/verify}
contract.document.platform-operator-name=${CONTRACT_PLATFORM_OPERATOR_NAME:EduConnect}
contract.document.platform-contact-address=${CONTRACT_PLATFORM_CONTACT_ADDRESS:Hệ thống EduConnect}
contract.document.platform-support-email=${CONTRACT_PLATFORM_SUPPORT_EMAIL:support@educonnect.vn}

contract.storage.provider=${CONTRACT_STORAGE_PROVIDER:local}
contract.storage.local-root=${CONTRACT_STORAGE_LOCAL_ROOT:./data/contract-artifacts}
contract.storage.bucket=${CONTRACT_STORAGE_BUCKET:}
contract.storage.region=${CONTRACT_STORAGE_REGION:ap-southeast-1}
contract.storage.access-key-id=${CONTRACT_STORAGE_ACCESS_KEY_ID:}
contract.storage.secret-access-key=${CONTRACT_STORAGE_SECRET_ACCESS_KEY:}
contract.storage.key-prefix=${CONTRACT_STORAGE_KEY_PREFIX:dev}
