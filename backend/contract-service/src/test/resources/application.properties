spring.datasource.url=jdbc:h2:mem:contract_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_contract_schema_history
blockchain.enabled=false
LEARNING_SERVICE_URL=http://127.0.0.1:1
NOTIFICATION_SERVICE_URL=http://127.0.0.1:1
jwt.secret=test-contract-service-jwt-secret-key-256-bit-minimum-value
