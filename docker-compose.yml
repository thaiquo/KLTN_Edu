services:
  postgres:
    image: postgres:16
    container_name: kltn-postgres

    environment:
      POSTGRES_DB: kltn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: